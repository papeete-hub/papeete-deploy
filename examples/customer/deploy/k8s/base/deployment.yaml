apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: customer
          ports:
            - containerPort: 8080
          env:
            - name: WAITER_URL
              value: http://table-service-waiter:8080/
